<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <title>Remote PC Timer</title>

  <link rel="stylesheet" href="./style.css" />
</head>

<body class="locked-mode">
  <main class="timer-card">
    <!-- Full-screen lock interface -->
    <section id="lockScreen" class="lock-screen">
      <div class="brand-icon">T</div>

      <p class="eyebrow">REMOTE PC TIMER</p>

      <h1>PC Access Restricted</h1>

      <div id="connection" class="connection disconnected">
        <span class="connection-dot"></span>
        <span id="connectionText">Connecting to server...</span>
      </div>

      <p id="lockDescription" class="lock-description">
        No active timer session was detected.
      </p>

      <div class="lock-countdown-label">
        Automatic shutdown countdown
      </div>

      <div id="countdown">02:00</div>

      <p id="status" role="status">
        Checking timer status...
      </p>

      <div class="admin-section">
        <button id="adminButton" class="admin-button" type="button">
          Administrator Access
        </button>

        <section id="adminPanel" class="admin-panel" hidden>
          <label for="adminPassword">
            Administrator password
          </label>

          <input
            id="adminPassword"
            type="password"
            placeholder="Enter password"
            autocomplete="current-password"
          />

          <p id="adminError" class="admin-error" hidden></p>

          <button id="adminLoginButton" type="button">
            Unlock Interface
          </button>

          <button
            id="cancelAdminButton"
            class="secondary-button"
            type="button"
          >
            Cancel
          </button>
        </section>

        <section id="maintenancePanel" class="maintenance-panel" hidden>
          <h2>Administrator Access</h2>

          <p>
            Administrator access verified for this demo.
          </p>

          <button id="closeAppButton" type="button">
            Close Application
          </button>

          <button
            id="relockButton"
            class="secondary-button"
            type="button"
          >
            Return to Lock Screen
          </button>
        </section>
      </div>

      <p class="note">
        Contact the administrator if you need assistance.
      </p>
    </section>

    <!-- Active mode: timer only -->
    <section id="activeScreen" class="active-screen" hidden>
      <div id="activeCountdown">00:00:00</div>
    </section>
  </main>

  <script src="./renderer.js"></script>
</body>
</html>
